# Task Manifest — PLAN-001 / FW-2. Format: .ai/templates/TASK-MANIFEST-TEMPLATE.yaml (pre-PLAN-001 fields).
task_id: FW-2
plan_id: PLAN-001
serves: [PLAN-001 §6.3]
title: Điểm vào CLAUDE.md, vùng theo thư mục con, worktree ở .claude/worktrees
objective: Claude Code luôn nạp AGENTS.md; vùng đỏ khai theo thư mục con của .ai; worktree nằm ở chỗ mặc định của Claude Code
type: T7
risk: R2
risk_reason: Đổi điểm vào và bản đồ vùng của khung; không chạm phân quyền, tiền, dữ liệu cá nhân
autonomy: A3
agent: executor

context:
  docs: ["PLAN.md §6.3 Vùng file trong .ai/"]
  rules: [git]
  skills: [documentation]

instructions: |
  1. Create CLAUDE.md at the repo root containing exactly one line: @AGENTS.md
     (Verified on Claude Code 2.1.326: AGENTS.md is ignored when a parent folder has a CLAUDE.md;
     a CLAUDE.md that imports it fixes this.) Add one line to AGENTS.md saying CLAUDE.md exists only
     to import this file.
  2. Create .claude/settings.json: {"worktree": {"baseRef": "head"}}  (valid JSON, nothing else).
  3. Delete .ai/worktrees/ (it holds only .gitkeep): git rm .ai/worktrees/.gitkeep
  4. .gitignore: replace the two .ai/worktrees lines and their comment with
     "# Worktree của AI: không commit" and ".claude/worktrees/". Keep the other entries.
  5. Zone map: in PROJECT.md §2.2 replace the single red row for `.ai/` with three rows:
     red: .ai/rules/, .ai/skills/, .ai/workflows/, .ai/templates/, .ai/agents/, .ai/guide/, README files in .ai/;
     green: .ai/plans/ (Plans have their own approval before any Run);
     no zone, not committed: .claude/worktrees/ (files edited there follow the zone of their original path).
     Make the same change wherever text says the whole `.ai/` is red: .ai/README.md, .ai/rules/README.md,
     .ai/templates/README.md, .ai/workflows/README.md, docs/getting-started.md (row "Muốn sửa Rule, Skill").
  6. Replace .ai/worktrees with .claude/worktrees in: README.md (tree), .ai/README.md (table row),
     .ai/workflows/task-execution.md ("Isolation and merging": say Claude Code creates them with
     `claude -w <Task-ID>`; other tools use `git worktree add .claude/worktrees/<Task-ID> -b <branch> <base>`),
     .ai/agents/references/claude-code.md (cd example), docs/00-project-overview/glossary.md (Worktree row).
  Human-facing files stay Vietnamese.

inputs: [FW-1]
outputs:
  - CLAUDE.md
  - .claude/settings.json
  - .gitignore
  - PROJECT.md, AGENTS.md, README.md, .ai/README.md, .ai/rules/README.md, .ai/templates/README.md, .ai/workflows/README.md
  - .ai/workflows/task-execution.md, .ai/agents/references/claude-code.md
  - docs/getting-started.md, docs/00-project-overview/glossary.md
  - handoff report (DELIVERY-REPORT §1–§4, §8)
scope:
  allowed_paths: [CLAUDE.md, AGENTS.md, .claude/settings.json, .gitignore, PROJECT.md, README.md, .ai/README.md, .ai/rules/README.md, .ai/templates/README.md, .ai/workflows/README.md, .ai/workflows/task-execution.md, .ai/agents/references/claude-code.md, docs/getting-started.md, docs/00-project-overview/glossary.md, .ai/worktrees/.gitkeep]
  zones: [red]
  out: [Code replacement outside the lines touched (FW-6, FW-7)]
dependencies: [FW-1]

acceptance_criteria:
  - id: FW-2-AC1
    check: { type: command, run: "test \"$(cat CLAUDE.md)\" = '@AGENTS.md' && python3 -I -c \"import json; assert json.load(open('.claude/settings.json'))['worktree']['baseRef']=='head'\"" }
  - id: FW-2-AC2
    check: { type: command, run: "test ! -e .ai/worktrees && git check-ignore -q .claude/worktrees/x && ! git check-ignore -q .claude/settings.json" }
  - id: FW-2-AC3
    check: { type: command, run: "! grep -rn '\\.ai/worktrees' --include=*.md --include=*.yaml --include=.gitignore . --exclude-dir=pilot --exclude-dir=plans" }
  - id: FW-2-AC4
    check: { type: command, run: "grep -q '\\.ai/plans/' PROJECT.md && grep -q '\\.ai/rules/' PROJECT.md && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py links" }

dispatch: dispatched
execution:
  start: M2·E1
  floor: M2·E1
  ceiling: M2·E3
  deviation_reason: ""
  budget: { max_cost_usd: 1, timeout_min: 30, max_output_tokens: 20000 }
escalation:
  ladder: [M2·E1, M2·E3]
  max_attempts: 2
  escalate_on: [ac_failed, incomplete_output, invalid_output]
  stop_on: [missing_input, conflicting_requirement, out_of_scope, security_finding, environment_error, permission_denied]
commit: "chore(ai): thêm CLAUDE.md, vùng theo thư mục con, worktree ở .claude/worktrees (body: FW-2, PLAN-001)"
gate: none
status: New
