# Task Manifest — PLAN-001 / FW-3. Format: .ai/templates/TASK-MANIFEST-TEMPLATE.yaml (pre-PLAN-001 fields).
task_id: FW-3
plan_id: PLAN-001
serves: [PLAN-001 §6.2]
title: ai-config.yaml ghi thẳng model/effort theo loại việc
objective: Lập Plan chỉ đọc ai-config.yaml để biết model/effort, ngân sách, stack, lệnh kiểm; model-effort.md chỉ còn quy tắc
type: T7
risk: R2
risk_reason: Viết lại quy tắc chọn mức và nâng mức mà mọi Plan sau dựa vào
autonomy: A3
agent: executor

context:
  docs: ["PLAN.md §6.2 ai-config.yaml (gốc repo)"]
  rules: [git]
  skills: [documentation]

instructions: |
  1. Create ai-config.yaml at the repo root with exactly the content of PLAN §6.2 (keys: tool,
     sessions, tasks, high_risk_min, budget_usd_per_task, stack, commands). Comments may be added
     in Vietnamese; keep values. Every skill folder in .ai/skills/ plus `lookup` appears in exactly
     one `for` list.
  2. .ai/workflows/model-effort.md: keep only the rules. Delete the default-levels table (§2) and
     the tier definitions (M1-M3, E1-E4, level order). A Task's levels come from ai-config.yaml
     `tasks`: the row containing the Task's main Skill; a Task with several Skills takes the longest
     `try`. `try[0]` is the start, the last item is the maximum; escalation moves one item right.
     `high_risk_min`: a `high`-risk Task or one using authentication-rbac / security-review never runs
     below it (drop lower items). Rewrite escalation rules in §3 with "next item in try" and
     "last item" instead of ladder/ceiling/floor. Keep the evaluation table and every stop rule.
     §4 becomes: switching AI tool = copy the `sessions`/`tasks` block from
     .ai/agents/references/<tool>.md into ai-config.yaml; do not read the reference file to plan.
  3. Each .ai/agents/references/<tool>.md (claude-code, codex, copilot, cursor, gemini): replace the
     M/E mapping table in §1 with one ```yaml block holding `sessions` and `tasks` for that tool,
     same `for` lists as ai-config.yaml, models from that file's current mapping (tools without
     effort: model name only, no "/effort"). Keep the other sections; replace any M·E code in them.
  4. .ai/templates/TASK-MANIFEST-TEMPLATE.yaml: replace execution start/floor/ceiling and
     escalation.ladder with `execution.try: [sonnet/low, sonnet/high, opus/high]` copied from
     ai-config.yaml (comment: deviation needs deviation_reason and Plan approval). Keep budget,
     max_attempts, escalate_on, stop_on. Use scale words from FW-1 for type/risk/autonomy examples.
  5. .ai/templates/RUNS-TEMPLATE.md and PLAN-TEMPLATE.md: level columns become "model/effort"
     (e.g. sonnet/low) and "Thứ tự thử"; remove tier codes.
  6. Skills with technology references (backend-development, frontend-development, database-design,
     caching, deployment): change the "Load only the file of the framework..." sentence to
     "Load the file matching ai-config.yaml `stack`; if `stack` lacks the entry, ask."
  7. task-execution.md: wherever it cites model-effort §2 defaults or "project's default budget",
     point to ai-config.yaml (`tasks`, `budget_usd_per_task`).
  8. Repo structure in README.md (added 2026-11-19 at the framework developer's request):
     - task-execution.md step 7 (Self-review) and .ai/skills/documentation/SKILL.md "Done when": a Task
       that adds, moves, renames or deletes a file or folder updates the tree under "Cấu trúc" in
       README.md in the same change.
     - task-execution.md step 5 and .ai/skills/task-planning/SKILL.md step 5 (Parallelize): README.md is
       a shared file, so Tasks running in parallel never edit its tree; each lists its structure change
       in its handoff report, and the Orchestrator updates the tree once after merging, before step 6.
     - task-execution.md step 6: the merged result passes the README tree check
       (`check.py tree` of PLAN-001 until it moves to a shared script).

  B. Amendment 2026-11-19 after the batch-1 review (framework developer decision; the steps above
     are done, commit 4e0ff2e). ai-config.yaml is the only source of model/effort; tool reference
     files go away; a tool without effort escalates to a stronger model.
  9. ai-config.yaml:
     - Add `dispatch: auto` after `tool` (comment: auto = the Orchestrator starts each Run itself
       with the level of the manifest; attended = a human opens each Run's session; tools that cannot
       set the model per Run use attended).
     - Header comments: delete the "copy the block from .ai/agents/references" line. Add: "Đổi công cụ
       AI: sửa `tool`, `dispatch` và ghi tên model của công cụ đó vào `sessions`, `tasks`,
       `high_risk_min`. Công cụ không chỉnh được effort: mỗi mức chỉ ghi tên model, phần tử kế trong
       `try` là model mạnh hơn, không lặp model (ví dụ try: [model-chuẩn, model-mạnh])."
     Keep every current value.
  10. .ai/workflows/model-effort.md:
     - §2: a level is `model/effort`, or `model` alone when the tool cannot set effort. The whole file
       uses one form. Without effort, each next item in `try` is a stronger model; adjacent items never
       repeat the same model (a repeat is not an escalation). A `try` of one item reruns at the same
       level (§3 rule 2).
     - §4 becomes "Tool settings": the values are in ai-config.yaml; switching tool = edit `tool`,
       `dispatch` and the model names there; nothing else to copy. `dispatch: attended` makes every Run
       attended (task-execution, "Orchestration"). Keep "Always set effort explicitly" (only when the
       tool has effort), the "not applied: <field>" rule, and the "lacks a model of the required
       strength: stop and ask" rule. Delete the tool/reference table and the "tool not listed" line.
  11. Delete .ai/agents/references/ (git rm -r): claude-code.md, codex.md, copilot.md, cursor.md, gemini.md.
     Before deleting, move the verified Claude Code facts into docs/03-engineering/ai-tools.md as a new
     section "## 5. Chạy Task với Claude Code" (Vietnamese, for humans; FW-4 later moves this file to
     .ai/guide/). Keep only what was verified on Claude Code 2.1.326, short:
       - one non-interactive Run per Task: `claude -p --model <m> --effort <e> --max-budget-usd <rest>
         --output-format json --permission-mode acceptEdits --allowedTools "<list>" -- "<prompt>"`,
         run inside the Task's worktree; prompt after `--`;
       - `--allowedTools` is one space-separated string; commands outside it are blocked and listed in
         `permission_denials`; chained commands (`;`, `&&`, `cd`) and helper scripts get blocked, so the
         prompt asks for one command per Bash call and edits via Edit/Write;
       - writing files under `.claude/` is blocked in this mode even when allowed by name: a human
         creates those files;
       - read `is_error` (an API error can end the Run with `subtype: success`), `total_cost_usd`,
         `modelUsage`, `permission_denials` from the JSON for runs.md; `--max-budget-usd` works only
         with `-p` and per call (set it to the Task's remaining budget);
       - no output-token flag: record "không áp dụng: max_output_tokens";
       - `step-by-step` Tasks: a human opens `claude --model <m> --effort <e>` in the worktree;
       - orchestrator session: `/model` and `/effort` from `sessions.orchestrator`;
       - Reviewer/Security subagent example (`.claude/agents/reviewer.md`, model/effort from
         `sessions.review`), body only points to .ai/.
     Also in ai-tools.md §1 table, keep tool names and entry files only; say model names live in
     ai-config.yaml.
  12. Fix every link or mention of .ai/agents/references (except files FW-4 moves later, which FW-4 fixes;
     still fix them now if they would break links): .ai/agents/README.md (section "Subagent theo vai và
     mức": subagent names from ai-config levels, e.g. `executor-sonnet-low`; last line points to
     ai-config.yaml and docs/03-engineering/ai-tools.md §5), task-execution.md ("Tool without per-Task
     model control (see its reference file)" -> "`dispatch: attended` in ai-config.yaml"),
     TASK-MANIFEST-TEMPLATE.yaml header comment, docs/getting-started.md (§5.2 last bullet: model names
     from ai-config.yaml; Claude Code run commands in ai-tools §5), README.md tree if it lists references.
     Also fix the stale "model-effort §2" citations whose meaning changed: task-types.md line 11 and
     task-planning/SKILL.md "Read:" line both mean "ai-config.yaml `tasks`".
  C. Amendment 2026-11-19 after FW-3#2 (framework developer decision): the key `dispatch` in
     ai-config.yaml clashes with the manifest field `dispatch: dispatched | attended`. Rename it.
  13. ai-config.yaml: replace `dispatch: auto` with `auto_runs: true` (comment: true = the Orchestrator
     starts each Run itself at the manifest's level, following docs/03-engineering/ai-tools.md §5;
     false = a human opens each Run's session; tools that cannot set the model per Run use false).
     Header comment: "sửa `tool`, `auto_runs` ...".
  14. Replace the ai-config key `dispatch` / values `auto`/`attended` with `auto_runs` / `true`/`false` in
     model-effort.md §4, task-execution.md "Orchestration" ("Tool without per-Task model control
     (`auto_runs: false` ...)"), docs/getting-started.md §5.2. Do NOT touch the manifest field
     `dispatch: dispatched | attended` (TASK-MANIFEST-TEMPLATE, task-execution "Dispatch mode").
  15. docs/03-engineering/ai-tools.md §5 intro: replace "AI không nạp mục này khi làm Task" with
     "Orchestrator đọc mục này khi `auto_runs: true` và `tool: claude-code`; Run của Task không nạp".
     model-effort.md §4 and task-execution.md "Orchestration" point to that section for how to start
     a Run when `auto_runs: true`.
  D. Review fixes 2026-11-19 (PLAN-001-REVIEW#1 findings 1, 2, 3, 5, 6, 10; framework developer chose
     option (c) for several Skills). Change only what is listed.
  16. model-effort.md §2:
     - Several Skills: replace "A Task with several Skills takes the row with the longest `try`" with:
       "Skills of one Task come from the same `tasks` row. A Skill from another row added during a Run
       (task-execution transition rule 5) makes `try` the item-wise higher of the two rows, longer row's
       tail kept; this changes `try`, so it needs Plan re-approval."
     - Level order (new sentence): "Order of levels: the position in `try`. Between rows: a stronger model
       is higher; with the same model, effort `low < medium < high < xhigh < max`. Model-only levels: the
       order of models in `sessions`, `tasks` of ai-config.yaml, weakest first. `high_risk_min` and 'never
       step down' use this order."
     - §3 rule 8: replace "Skills whose Tasks are evaluated by commands" with an explicit list: Tasks whose
       AC are all `command` checks (testing, development, refactoring, bug-fixing, caching, deployment Skills).
  17. .ai/guide/ai-tools.md §3 (Claude Code runs): add four short bullets, Vietnamese:
     `--allowedTools` chỉ mở lệnh có trong `acceptance_criteria[].check` và lệnh git chỉ đọc; không dùng
     `bypassPermissions`; `allowed_paths` không có cờ: Orchestrator kiểm file đổi ở tiêu chí Hợp lệ;
     `permission_denials` chặn bước bắt buộc thì là `permission_denied`: dừng, không nâng mức.
  18. .ai/agents/README.md: delete the section "Subagent theo vai và mức" (no template remains for it; Runs
     use one session per Run). Line 15 (Orchestrator row): "nâng mức trong thang đã duyệt" -> "nâng mức theo
     `try` đã duyệt"; "vượt trần" -> "vượt mức tối đa". Fix any link to the deleted section.
  19. .ai/skills/task-planning/SKILL.md "Done when": "a level range within model-effort floors" ->
     "`execution.try` copied from one ai-config.yaml `tasks` row (deviation stated)".
     .ai/workflows/task-types.md line 11: "several adjacent Skills of the same default level" -> "several
     adjacent Skills of the same ai-config.yaml `tasks` row".
  20. task-execution.md step 6: replace "(`check.py tree` of PLAN-001 until it moves to a shared script)" with
     "(compare the tree with `git ls-files`; a Plan may provide a script)". Do not reference .ai/plans/.
inputs: [FW-2]
outputs:
  - ai-config.yaml
  - .ai/workflows/model-effort.md, .ai/workflows/task-execution.md
  - .ai/agents/references/ deleted; .ai/agents/README.md; docs/03-engineering/ai-tools.md (§5 Claude Code); docs/getting-started.md; .ai/workflows/task-types.md
  - .ai/templates/TASK-MANIFEST-TEMPLATE.yaml, RUNS-TEMPLATE.md, PLAN-TEMPLATE.md
  - .ai/skills/{backend-development,frontend-development,database-design,caching,deployment,task-planning,documentation}/SKILL.md
  - README.md (tree: add ai-config.yaml)
  - handoff report (DELIVERY-REPORT §1–§4, §8)
scope:
  allowed_paths: [ai-config.yaml, README.md, .ai/workflows/model-effort.md, .ai/workflows/task-execution.md, .ai/agents/references/, .ai/templates/TASK-MANIFEST-TEMPLATE.yaml, .ai/templates/RUNS-TEMPLATE.md, .ai/templates/PLAN-TEMPLATE.md, .ai/skills/backend-development/SKILL.md, .ai/skills/frontend-development/SKILL.md, .ai/skills/database-design/SKILL.md, .ai/skills/caching/SKILL.md, .ai/skills/deployment/SKILL.md, .ai/skills/task-planning/SKILL.md, .ai/skills/documentation/SKILL.md, .ai/agents/README.md, .ai/workflows/task-types.md, docs/03-engineering/ai-tools.md, docs/getting-started.md, .ai/guide/ai-tools.md]
  zones: [red]
  out: [Changing the default levels themselves, Moving files to .ai/guide (FW-4), Code replacement beyond touched lines (FW-6, FW-7)]
dependencies: [FW-2]

acceptance_criteria:
  - id: FW-3-AC1
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py config" }
  - id: FW-3-AC2
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py codes ai-config.yaml .ai/workflows/model-effort.md .ai/templates/TASK-MANIFEST-TEMPLATE.yaml .ai/templates/RUNS-TEMPLATE.md .ai/templates/PLAN-TEMPLATE.md .ai/guide/ai-tools.md" }
    # Narrowed 2026-11-19 (framework developer approved): BUG-TEMPLATE, TEST-REPORT-TEMPLATE are out of FW-3 scope; FW-6 replaces their codes
  - id: FW-3-AC3
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py links" }
  - id: FW-3-AC4
    check: { type: human, who: "Người phát triển khung xem đợt 1 (FW-1..FW-3) trước khi chạy FW-4" }
  - id: FW-3-AC5
    check: { type: command, run: "grep -q 'ai-config.yaml' README.md && grep -qi 'README' .ai/skills/documentation/SKILL.md && grep -qi 'README' .ai/skills/task-planning/SKILL.md && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py tree" }

  - id: FW-3-AC6
    check: { type: command, run: "test ! -e .ai/agents/references && ! grep -rn 'agents/references' --include=*.md --include=*.yaml . --exclude-dir=pilot --exclude-dir=plans && grep -q '^## 3. Chạy Task với Claude Code' .ai/guide/ai-tools.md && grep -q 'auto_runs' .ai/workflows/model-effort.md" }
  - id: FW-3-AC7
    check: { type: command, run: "! grep -rnE '(dispatch: (auto|attended)\\b|`dispatch`.*ai-config|ai-config.*`dispatch`)' --include=*.md --include=*.yaml . --exclude-dir=pilot --exclude-dir=plans && grep -q 'auto_runs' .ai/workflows/task-execution.md && grep -q 'auto_runs' .ai/guide/ai-tools.md" }
    # amendment C 2026-11-19
    # amendment 2026-11-19; AC1 (check.py config) now also checks auto_runs, model-only levels, no repeated item in try, references removed
  - id: FW-3-AC8
    check: { type: command, run: "! grep -n 'longest' .ai/workflows/model-effort.md && grep -q 'xhigh < max' .ai/workflows/model-effort.md && grep -q 'bypassPermissions' .ai/guide/ai-tools.md && ! grep -q 'Subagent theo vai và mức' .ai/agents/README.md && ! grep -rnE 'floors|same default level|thang đã duyệt|of PLAN-001 until' .ai/skills .ai/workflows .ai/agents" }
    # review fixes D, 2026-11-19
    # AC6/AC7 paths updated after FW-4 moved ai-tools.md to .ai/guide/ (section 5 became 3); meaning unchanged
dispatch: dispatched
execution:
  start: M2·E3                      # sonnet/high
  floor: M2·E3
  ceiling: M3·E3                    # opus/high
  deviation_reason: "Viết lại quy tắc nâng mức mà mọi Plan sau dựa vào; bắt đầu ở mức cao (duyệt cùng Plan)"
  budget: { max_cost_usd: 3, timeout_min: 40, max_output_tokens: 30000 }   # raised 2 -> 3 USD on 2026-11-19 (amendment B)
escalation:
  ladder: [M2·E3, M3·E3]
  max_attempts: 2
  escalate_on: [ac_failed, incomplete_output, invalid_output]
  stop_on: [missing_input, conflicting_requirement, out_of_scope, security_finding, environment_error, permission_denied]
commit: "refactor(ai): ai-config.yaml ghi thẳng model/effort theo loại việc (body: FW-3, PLAN-001)"
gate: "Người phát triển khung"
status: Done