# Task Manifest — PLAN-001 / FW-4. Format: .ai/templates/TASK-MANIFEST-TEMPLATE.yaml (fields after FW-3).
task_id: FW-4
plan_id: PLAN-001
serves: [PLAN-001 §6.4]
title: Chuyển tài liệu khung từ docs/ sang .ai/guide/
objective: docs/ chỉ còn hồ sơ của dự án; tài liệu khung cho người nằm ở .ai/guide/
type: docs-only
risk: medium
risk_reason: Chuyển nhiều file, khoảng 190 link; không đổi nội dung quy tắc
autonomy: full-task
agent: executor

context:
  docs: ["PLAN.md §6.4 Chuyển file"]
  rules: [git]
  skills: [documentation]

instructions: |
  Use `git mv` so history follows each file. Files in .ai/guide/ stay Vietnamese (they are for humans).
  1. git mv to .ai/guide/: docs/getting-started.md, docs/04-project-management/gates-and-rigor.md,
     docs/04-project-management/work-model.md, docs/04-project-management/task-breakdown.md,
     docs/03-engineering/ai-governance.md, docs/03-engineering/external-skills.md,
     docs/03-engineering/ai-tools.md.
  2. task-breakdown.md: delete the example Task table at the top (Task rows belong in
     docs/04-project-management/task-backlog.md); keep the rules and the Task Specification template.
  3. ai-tools.md: keep §1-§2 (how to connect tools). Move §3 (tools the project uses, permissions)
     and §4 (MCP servers) into a new PROJECT.md section "Công cụ AI" (two tables, empty rows);
     ai-tools.md points there and to ai-config.yaml for model names.
  4. glossary: create .ai/guide/glossary.md with §1 "Thuật ngữ chung" of
     docs/00-project-overview/glossary.md (framework terms). The project glossary keeps only §2
     (business terms) and its history table, plus one line pointing to .ai/guide/glossary.md.
  5. Fix every link and every path mention to moved files across the repo (markdown links, plain
     paths like `docs/getting-started.md`, "Tài liệu liên quan" rows), including .ai/ files, README.md,
     AGENTS.md, PROJECT.md, docs/*/README.md (remove moved files from their tree and table).
  6. Add .ai/guide/README.md: one table, file -> what it answers (Vietnamese, 10 rows max).
  7. README.md "Cấu trúc" tree: add .ai/guide/ (one line: tài liệu khung cho người), remove
     getting-started.md from under docs/.
  Do not change any rule content while moving.

inputs: [FW-3]
outputs:
  - .ai/guide/*.md
  - PROJECT.md (section "Công cụ AI"), docs/00-project-overview/glossary.md
  - every file whose links pointed to a moved file
  - handoff report (DELIVERY-REPORT §1–§4, §8)
scope:
  allowed_paths: [.ai/guide/, docs/, .ai/rules/, .ai/skills/, .ai/workflows/, .ai/templates/, .ai/agents/, .ai/README.md, README.md, AGENTS.md, PROJECT.md]
  zones: [red, green]
  out: [Code replacement (FW-6, FW-7), Content changes beyond §6.4]
dependencies: [FW-3]

acceptance_criteria:
  - id: FW-4-AC1
    check: { type: command, run: "for f in getting-started gates-and-rigor work-model task-breakdown ai-governance external-skills ai-tools glossary README; do test -f .ai/guide/$f.md || exit 1; done; test ! -e docs/getting-started.md && test ! -e docs/04-project-management/gates-and-rigor.md && test ! -e docs/03-engineering/ai-tools.md" }
  - id: FW-4-AC2
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py links" }
  - id: FW-4-AC3
    check: { type: command, run: "! grep -rnE 'docs/(getting-started|04-project-management/(gates-and-rigor|work-model|task-breakdown)|03-engineering/(ai-governance|external-skills|ai-tools))' --include=*.md --include=*.yaml . --exclude-dir=pilot --exclude-dir=plans" }
  - id: FW-4-AC4
    check: { type: command, run: "grep -q 'Công cụ AI' PROJECT.md && test $(wc -c < docs/00-project-overview/glossary.md) -lt 3000" }
  - id: FW-4-AC5
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py tree" }

dispatch: dispatched
execution:
  try: [sonnet/low, sonnet/high]
  deviation_reason: ""
  budget: { max_cost_usd: 1.5, timeout_min: 40, max_output_tokens: 30000 }
escalation:
  max_attempts: 2
  escalate_on: [ac_failed, incomplete_output, invalid_output]
  stop_on: [missing_input, conflicting_requirement, out_of_scope, security_finding, environment_error, permission_denied]
commit: "refactor(docs): chuyển tài liệu khung từ docs/ sang .ai/guide/ (body: FW-4, PLAN-001)"
gate: none
status: New
