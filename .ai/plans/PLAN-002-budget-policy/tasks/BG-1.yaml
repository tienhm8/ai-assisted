# Task Manifest — PLAN-002 / BG-1. Format: .ai/templates/TASK-MANIFEST-TEMPLATE.yaml.
task_id: BG-1
plan_id: PLAN-002
serves: ["PLAN-002 §6.1, §6.2, §6.5: quy tắc cảnh báo, tính số thiếu, cấp thêm, giữ chỗ, đồng bộ manifest, thu hồi, đo phiên điều phối (yêu cầu 2026-11-19)"]
title: Quy tắc và mẫu cho AI về cảnh báo, cấp thêm và thu hồi ngân sách
objective: Khung có quy tắc ghi thẳng cách xử lý Task thiếu ngân sách (cảnh báo, đánh giá lại, cấp thêm từ quỹ dự phòng có giữ chỗ, đồng bộ manifest, thu hồi), ba giá trị trong ai-config.yaml, và sổ ghi mọi điều chỉnh trong runs.md
type: docs-only
risk: medium
risk_reason: Sửa quy tắc và workflow Approved ở vùng đỏ; cho Orchestrator tự cấp thêm ngân sách trong hạn mức, nhưng không chạm phân quyền, dữ liệu cá nhân, tiền thật; tổng ngân sách Plan không tự tăng
autonomy: full-task
agent: executor

context:
  docs: ["PLAN.md §6.1 Quy tắc ngân sách", "PLAN.md §6.2 Ba giá trị", "PLAN.md §6.3 Vì sao không cần sửa project-rules", "PLAN.md §6.4 Lựa chọn mặc định", "PLAN.md §6.5 Đo chi phí phiên điều phối"]
  rules: [git]
  skills: [documentation]

instructions: |
  Read PLAN-002 PLAN.md §6 first; it is the design. Implement it exactly; do not invent values or behavior.
  English in .ai/workflows and .ai/skills; Vietnamese in the two templates written in Vietnamese (PLAN-TEMPLATE,
  RUNS-TEMPLATE) and in ai-config.yaml comments; manifest-template comments stay English. Use scale words and
  plain words, never choice codes (project-rules 23). Do not edit project-rules (PLAN §6.3). Do not touch
  .ai/plans/PLAN-001-framework-refactor/.
  Verify before use (project-rules 16): read ai-config.yaml, model-effort.md, task-execution.md, both templates
  and the task-planning Skill in full before editing; line numbers in this file are hints, not truth.
  Formula names in the rules may be written in plain words (e.g. "current budget", "spent", "remaining",
  "projected total", "remaining cost"); keep the meaning of PLAN §6.1 steps 1 to 10 exactly.

  1. ai-config.yaml: after `budget_usd_per_task`, add three keys with a Vietnamese comment each:
       budget_warn_pct: 80          # Cảnh báo khi chi phí cộng dồn của Task đạt mức này (% ngân sách hiện hành)
       budget_topup_max_pct: 50     # Tổng cấp thêm tối đa cho một Task (% ngân sách ban đầu)
       budget_pool_pct: 20          # Quỹ dự phòng mặc định của Plan (% tổng ngân sách ban đầu của các Task)
     Keep the header consistent: Plan-making reads only this file.
  2. .ai/workflows/model-effort.md:
     - Line 7: add the three new keys to the list of keys that live in ai-config.yaml.
     - Rule 5, last sentence: replace "`budget.max_cost_usd`" with "the Task's current budget (rule 6)".
     - Rule 6: define the Task's current budget = initial budget (`budget.initial_cost_usd`) plus top-ups granted
       under rule 10, recorded in the runs.md ledger; `budget.max_cost_usd` always equals the current budget
       (rule 12); the per-call limit (`--max-budget-usd`) for the next Run = current budget minus cost so far;
       keep "default budget is `budget_usd_per_task`".
     - Rule 7: replace "or budget" with "or a budget that rules 10 to 12 cannot top up".
     - Add rules 9 to 13 after rule 8, same style as existing rules:
       9. Warning and reassessment: after each Run, when cumulative cost reaches `budget_warn_pct` of the current
          budget, or the Run was cut at the per-call limit: no new Run starts; the Orchestrator reassesses from
          runs.md without a new Run and writes: work done, work remaining, why cost was high, and ONE cost
          estimate named explicitly: `projected total` (total cost of the Task from the start to done) or
          `additional cost` (cost still to spend from now). An unnamed estimate cannot be used in rule 10.
          No concrete remaining work: stop.
       10. Shortfall and conditions: remaining = current budget - spent. If the estimate is the projected total:
           shortfall = max(0, projected total - current budget). If it is the additional cost:
           shortfall = max(0, additional cost - remaining). Both give the same result when the numbers are
           consistent (projected total = spent + additional cost). Never confuse the two: do not subtract the
           current budget from an additional cost (under-grant); do not subtract `remaining` from a projected total
           (over-grant by the amount spent); never subtract `remaining` twice. The top-up amount is the shortfall.
           The Orchestrator grants from the Plan pool only when ALL hold: Task is not `high` risk; shortfall within the
           pool balance read from the runs.md ledger; Task's total top-ups plus amount within `budget_topup_max_pct`
           of `initial_cost_usd` (shortfall counted in that total); the reservation of rule 11 can be written. Otherwise stop and ask a human in the
           project-rules 21 format. No pool (fast lane, or a Plan without one): no top-up, stop and ask.
       11. Reserve and serialize: handle one top-up decision at a time, in the order the Runs ended in runs.md.
           Read the pool balance only from the ledger, never from memory. Order: read balance, check rule 10,
           write the reservation row in the ledger (balance drops now), only then continue. The next decision
           reads the lowered balance. If two Tasks both qualify but the pool covers one, the second is not
           granted a partial amount: stop and ask a human. A Task waiting for a decision starts no new Run.
       12. Sync the manifest: after the reservation and before the next Run, set `budget.max_cost_usd` in the
           Task's manifest to the new current budget; never edit `budget.initial_cost_usd` or any history. Order:
           reservation, manifest edit, Run. If the manifest edit fails, write a row returning the reservation and
           do not run. This edit is not a change needing re-approval.
       13. Reclaim and ledger: when a Task is accepted with spent below its current budget, the difference returns
           to the pool. A cancelled Task or one waiting for a human returns nothing until a human decides. Every
           reservation, return of a reservation, reclaim and stop-and-ask is a new row in the runs.md table
           "Điều chỉnh ngân sách"; old rows are never edited. The Orchestrator and Review budgets are not paid
           from the pool.
  3. .ai/workflows/task-execution.md:
     - "Plan approval" first paragraph: approving the Plan also approves the pool amount, the formula
       `maximum >= Task budgets + pool + Review + Orchestrator`, the three ai-config.yaml values and
       model-effort §3 rules 9 to 13.
     - Exception paragraph: add that the budget condition is judged when the Plan is made; a later top-up from
       the approved pool does not void it.
     - "Re-approval" paragraph: add that a top-up within model-effort §3 rule 10 and the manifest sync of rule 12
       are not changes; raising the Plan's maximum budget, the pool, or a Task's top-up beyond
       `budget_topup_max_pct` needs re-approval.
     - The stop-list entry about budget: add "or a top-up is not allowed (model-effort §3 rules 10 to 12)".
     - Step 5 and Step 7: where budget or cost is mentioned, point to model-effort §3 rules 9 to 13; step 7 adds:
       after each Task the human gives the Orchestrator (a) the session transcript file of the Orchestrator session
       (path under ~/.claude/projects/) and (b) the session USD read from `/cost` or from Account & Usage in the
       Claude Code extension (the framework developer named both; the Orchestrator has not verified them: the first
       time, compare the USD with the transcript tokens and ask again if they clearly disagree); the Orchestrator
       extracts only counts (model, effort, tokens by model, start and end time cut to the Task) and never copies
       conversation content; the handoff report states top-ups, reclaims and the session cost line.
  4. .ai/templates/PLAN-TEMPLATE.md (Vietnamese):
     - Row "Ngân sách cả Plan" becomes "Ngân sách tối đa của Plan": ghi công thức
       `NganSachToiDa >= NganSachTask + QuyDuPhong + Review + PhienDieuPhoi` với số cụ thể; quỹ nằm bên trong,
       không cộng thêm; không tự tăng; vượt thì dừng, hỏi người.
     - Add row "Quỹ dự phòng": số tiền, mặc định `budget_pool_pct` % tổng ngân sách ban đầu của các Task (ghi lý do
       nếu khác); không có quỹ thì ghi 0.
     - In "9. Kết quả": add one line to list cấp thêm, thu hồi, số dư quỹ cuối Plan.
  5. .ai/templates/RUNS-TEMPLATE.md (Vietnamese): after the existing table and bullets add
     - a table "Điều chỉnh ngân sách" with columns: Lần | Task | Loại (giữ chỗ cấp thêm / trả lại giữ chỗ / thu hồi /
       dừng hỏi người) | Số tiền (USD) | Ngân sách Task trước → sau | Số dư quỹ trước → sau | Lý do (kèm kết quả đánh giá
       lại: việc đã xong, việc còn lại, dạng ước tính) | Ngày; one placeholder row; a bullet that each adjustment is a
       new row, never an edit; a bullet that "Chi phí cộng dồn" is compared with the Task's current budget (ban đầu
       cộng cấp thêm).
     - the existing "Dòng cuối của bảng" bullet becomes "Dòng Phiên điều phối sau mỗi Task": file transcript, khoảng
       thời gian cắt theo Task, token theo model; số USD người đưa (đọc từ `/cost` hoặc Account & Usage), không có thì "không đo USD" và
       lý do; chỉ trích số liệu, không chép nội dung hội thoại.
  6. .ai/templates/TASK-MANIFEST-TEMPLATE.yaml: in `execution.budget` add `initial_cost_usd: 2` (comment: initial
     budget approved with the Plan; never edited; top-up limits are computed on it; default
     ai-config.yaml budget_usd_per_task) and change the comment on `max_cost_usd`: current budget = initial plus
     top-ups; the Orchestrator edits only this field when it grants a top-up (model-effort §3 rule 12). Change
     nothing else.
  7. .ai/skills/task-planning/SKILL.md: in procedure step 4 (budget) write both `initial_cost_usd` and
     `max_cost_usd` with the same value; in step 6 (Draft the Plan) state: the Plan declares the formula with
     numbers and a pool, default `budget_pool_pct` % of the Tasks' initial budgets (deviation needs a reason). Add to
     "Done when": the Plan states the formula and the pool amount.
  Do not change: project-rules; review priorities or severities; escalation order; max_attempts; the evaluation
  criteria (Complete, Correct, Valid, Confidence); any other framework file.

inputs: ["PLAN-001 finished (FW-8 merged)", "PLAN-002 PLAN.md §6"]
outputs:
  - ai-config.yaml
  - .ai/workflows/model-effort.md, .ai/workflows/task-execution.md
  - .ai/templates/PLAN-TEMPLATE.md, .ai/templates/RUNS-TEMPLATE.md, .ai/templates/TASK-MANIFEST-TEMPLATE.yaml
  - .ai/skills/task-planning/SKILL.md
  - handoff report (DELIVERY-REPORT §1–§4, §8)
scope:
  allowed_paths: [ai-config.yaml, .ai/workflows/model-effort.md, .ai/workflows/task-execution.md, .ai/templates/PLAN-TEMPLATE.md, .ai/templates/RUNS-TEMPLATE.md, .ai/templates/TASK-MANIFEST-TEMPLATE.yaml, .ai/skills/task-planning/SKILL.md]
  zones: [red]
  out: [project-rules, PLAN-001 files, guide/ (BG-2), escalation order, max_attempts, evaluation criteria, check.py]
dependencies: []   # PLAN-001 must be finished first (Plan "Phụ thuộc ngoài"); not a Task of this Plan

acceptance_criteria:
  - id: BG-1-AC1
    check: { type: command, run: "python3 -I -c \"import yaml; c=yaml.safe_load(open('ai-config.yaml', encoding='utf-8')); assert (c['budget_warn_pct'], c['budget_topup_max_pct'], c['budget_pool_pct']) == (80, 50, 20); assert c['budget_usd_per_task'] == 2\"" }
  - id: BG-1-AC2
    check: { type: command, run: "grep -q 'budget_warn_pct' .ai/workflows/model-effort.md && grep -q 'budget_topup_max_pct' .ai/workflows/model-effort.md && grep -qi 'pool' .ai/workflows/model-effort.md && grep -qi 'reserv' .ai/workflows/model-effort.md && grep -q 'initial_cost_usd' .ai/workflows/model-effort.md && grep -q 'max(0' .ai/workflows/model-effort.md && grep -q 'projected total' .ai/workflows/model-effort.md && grep -q 'additional cost' .ai/workflows/model-effort.md && grep -q 'top-up' .ai/workflows/task-execution.md && grep -qi 'transcript' .ai/workflows/task-execution.md" }
  - id: BG-1-AC3
    check: { type: command, run: "grep -q 'Quỹ dự phòng' .ai/templates/PLAN-TEMPLATE.md && grep -q 'Ngân sách tối đa' .ai/templates/PLAN-TEMPLATE.md && grep -q 'NganSachToiDa' .ai/templates/PLAN-TEMPLATE.md && grep -q 'Điều chỉnh ngân sách' .ai/templates/RUNS-TEMPLATE.md && grep -q 'transcript' .ai/templates/RUNS-TEMPLATE.md && grep -q 'initial_cost_usd' .ai/templates/TASK-MANIFEST-TEMPLATE.yaml && grep -q 'budget_pool_pct' .ai/skills/task-planning/SKILL.md" }
  - id: BG-1-AC4
    check: { type: command, run: "python3 -I .ai/plans/PLAN-001-framework-refactor/check.py links && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py config && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py vocab && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py types && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py tree && python3 -I .ai/plans/PLAN-001-framework-refactor/check.py codes .ai/workflows .ai/templates .ai/skills/task-planning ai-config.yaml" }
  - id: BG-1-AC5
    check: { type: command, run: "git diff --name-only <base>..HEAD" }   # Orchestrator confirms every path is in scope.allowed_paths (Valid criterion)
  - id: BG-1-AC6
    check: { type: human, who: "Người phát triển khung: chữ trong model-effort §3 quy tắc 9 đến 13 khớp bảng PLAN §6.1; thử hai ví dụ số ở PLAN §7 (cấp 0,3 khi quỹ còn 0,8; hai Task cùng thiếu 0,8 khi quỹ còn 0,8, chỉ một Task được cấp) và một ví dụ cho mỗi tên ước tính (ví dụ ngân sách hiện hành 2, đã dùng 1,7: `DuKienTong` 2,6 và `DuKienThem` 0,9 đều cho thiếu 0,6); Task rủi ro cao luôn hỏi người; không chỗ nào tự tăng ngân sách tối đa của Plan; evaluation và thứ tự thử không đổi" }

dispatch: dispatched
execution:
  try: [sonnet/high, opus/high]
  deviation_reason: "Viết lại quy tắc ngân sách và nâng mức mà mọi Plan sau dựa vào; bắt đầu ở mức cao như FW-3 (PLAN-001) để tránh tốn một Run chạy mức thấp rồi làm lại. Ngân sách 3 cao hơn mặc định 2: ước tính theo FW-3 (1,489 USD, 3 Run)."
  budget: { initial_cost_usd: 3, max_cost_usd: 3, timeout_min: 30, max_output_tokens: 20000 }
escalation:
  max_attempts: 3
  escalate_on: [ac_failed, incomplete_output, invalid_output]
  stop_on: [missing_input, conflicting_requirement, out_of_scope, security_finding, environment_error, permission_denied]
commit: "docs(ai): quy tắc cảnh báo, cấp thêm và thu hồi ngân sách (body: BG-1, PLAN-002)"
gate: "⏸ Người phát triển khung xem kết quả trước khi chạy BG-2"
status: New
