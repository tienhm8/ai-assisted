context:
  docs: ["PLAN.md §6.1 Quy tắc ngân sách", "model-effort.md §3 quy tắc 9 đến 13 và task-execution bước 7 về transcript (kết quả của BG-1)"]
  rules: [git]
  skills: [documentation]

instructions: |
  Vietnamese in .ai/guide (it is for humans); keep the Vietnamese wording of terms. No choice codes (project-rules 23).
  The source of truth is model-effort.md §3 rules 9 to 13 and task-execution step 7 as written by BG-1: copy its meaning, never add or change a rule.
  If a point in the guide needs a rule that BG-1 did not write, stop and report it (stop_on: conflicting_requirement).
  Read the three files in full before editing; line numbers here are hints.

  1. .ai/guide/getting-started.md, the table "Khi AI… | Bạn làm":
     - Row "Gửi Plan và các Task Manifest": add "quỹ dự phòng và ba giá trị ngân sách (cảnh báo, hạn mức cấp thêm, quỹ)"
       to what the reader approves.
     - Row "Dừng vì vượt mức tối đa, hết lượt hoặc hết ngân sách": keep, and say it now also covers: hạn mức cấp thêm
       đã hết, quỹ dự phòng đã hết, hoặc Task rủi ro cao cần cấp thêm.
     - Add a row "Xong một Task" → đưa cho Orchestrator đường dẫn file transcript của phiên điều phối (trong
       `~/.claude/projects/`); Orchestrator chỉ lấy số liệu (model, token, thời gian), không chép nội dung hội thoại;
       transcript có token, không có USD: đưa kèm số USD đọc từ `/cost` (tổng chi phí phiên hiện tại) hoặc từ mục Account & Usage của extension Claude Code; không đọc được thì ghi "không đo USD".
     - Add two rows: (a) "Cảnh báo Task dùng đến ngưỡng ngân sách" → đọc đánh giá của Orchestrator (việc đã xong, việc
       còn lại, vì sao tốn, ước tính để xong); nếu Task được cấp thêm trong hạn mức thì không cần làm gì, chỉ cần biết số
       đã cấp (Orchestrator đã giữ chỗ trong sổ và sửa ngân sách trong manifest trước khi chạy tiếp); (b) "Hỏi cấp thêm ngân sách" → chọn cấp thêm, đổi hướng, hoặc tự làm.
     - Keep every other row, including the FW-8 review row.
  2. .ai/guide/glossary.md: add rows in the existing format (Thuật ngữ | Định nghĩa | Đồng nghĩa / Tránh dùng | Nguồn),
     in alphabetical or the file's existing order: "Ngân sách tối đa của Plan (Maximum Budget)"; "Quỹ dự phòng của Plan
     (Plan Budget Pool)"; "Cấp thêm ngân sách (top-up)"; "Giữ chỗ ngân sách (reservation)"; "Thu hồi ngân sách". Nguồn: model-effort.md; PLAN-TEMPLATE.
  3. .ai/guide/ai-tools.md (Claude Code, around the `--max-budget-usd` bullet): add one bullet or sentence: the
     remaining budget is the Task's current budget (ban đầu cộng cấp thêm, bằng `budget.max_cost_usd` trong manifest sau khi Orchestrator đồng bộ) trừ chi phí đã dùng; a Run cut at the
     cap is read from the JSON result (the `is_error` field and whatever result fields the existing text already
     names; do not name a result subtype that is not already written in the file) and the Orchestrator treats it
     as reaching the warning threshold. Do not add commands.
  Do not change anything else.

